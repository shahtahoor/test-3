
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          unzip -q "$ZIP" -d extracted
          WRAPPER=$(find extracted -name gradlew -type f | head -n 1)
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Exam-Photo-Studio-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
